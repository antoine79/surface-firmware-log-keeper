# Build both programs and run every test on each push and pull request. No secrets, read-only token.
name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: cargo build --release && cargo test
        working-directory: rust
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv run --python 3.13 --with pytest pytest -q -p no:cacheprovider tests
